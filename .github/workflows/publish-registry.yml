# Publishes server.json to the Official MCP Registry when a version tag is pushed (e.g. v0.2.1).
# Setup: add repository secret MCP_REGISTRY_PRIVATE_KEY = hex private key, from:
#   openssl pkey -in key.pem -noout -text | grep -A3 "priv:" | tail -n +2 | tr -d ' :\n'
# The tag must match "version" in server.json (each version can only be published once).
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches server.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(jq -r .version server.json)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != server.json v$V"; exit 1; }

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Log in (DNS, evendo.com)
        run: mcp-publisher
